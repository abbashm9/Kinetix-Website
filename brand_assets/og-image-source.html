<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --lime: #C5E88A;
    --bg: #FAFAF8;
    --text: #1A1A1A;
    --muted: #6B6B70;
    --dark-surface: #1B1F2E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  /* subtle grid texture */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.022) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(circle at 70% 40%, #000 0%, transparent 75%);
            mask-image: radial-gradient(circle at 70% 40%, #000 0%, transparent 75%);
  }
  /* ambient orbs */
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb-1 { width: 620px; height: 620px; top: -180px; right: -120px;
    background: radial-gradient(circle, rgba(90,154,171,0.14) 0%, transparent 70%); }
  .orb-2 { width: 560px; height: 560px; bottom: -200px; left: -160px;
    background: radial-gradient(circle, rgba(197,232,138,0.20) 0%, transparent 70%); }

  .wrap {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 84px;
  }

  .left { max-width: 660px; }

  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 18px;
    border: 1px solid rgba(0,0,0,0.10);
    border-radius: 100px;
    background: rgba(255,255,255,0.7);
    font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--text);
    margin-bottom: 30px;
  }
  .badge .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--lime); filter: brightness(0.82);
    box-shadow: 0 0 0 4px rgba(197,232,138,0.30);
  }

  h1 {
    font-size: 104px; font-weight: 800; line-height: 0.90;
    letter-spacing: -0.04em; color: var(--text);
  }
  h1 .accent { color: var(--lime); filter: brightness(0.74); }

  .sub {
    margin-top: 30px;
    font-size: 21px; font-weight: 300; line-height: 1.55;
    color: var(--muted); max-width: 540px;
  }

  .url {
    position: absolute; left: 84px; bottom: 52px; z-index: 3;
    font-size: 17px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--text);
  }
  .url b { font-weight: 800; }

  /* K mark tile */
  .mark {
    width: 250px; height: 250px; border-radius: 44px;
    background: linear-gradient(150deg, #232838 0%, var(--dark-surface) 55%, #14171f 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 30px 70px -20px rgba(27,31,46,0.55),
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 0 60px -10px rgba(197,232,138,0.18);
    position: relative;
  }
  .mark::after {
    content: ""; position: absolute; inset: 0; border-radius: 44px;
    border: 1px solid rgba(197,232,138,0.18);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="wrap">
    <div class="left">
      <div class="badge"><span class="dot"></span>Kuwait's Forward-Moving Agency</div>
      <h1>We Set<br>Brands<br><span class="accent">In Motion.</span></h1>
      <p class="sub">Brand strategy, campaigns &amp; identities<br>built to accelerate growth — in Arabic &amp; English.</p>
    </div>

    <div class="right">
      <div class="mark">
        <svg width="150" height="150" viewBox="0 0 100 100">
          <rect x="18" y="14" width="18" height="72" rx="3" fill="rgba(255,255,255,0.92)"/>
          <path d="M36 50 L70 14 L82 14 Q72 32 55 50 Q72 68 82 86 L70 86 L36 50Z" fill="rgba(255,255,255,0.92)"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="url">kinetix<b>kw</b>.com</div>
</body>
</html>
